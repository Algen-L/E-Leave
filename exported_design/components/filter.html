<!-- 
    Exported Filter Component 
    Includes: Custom Dropdown with active states and custom date inputs
-->
<form method="GET" id="filterForm" class="filter-form" style="margin: 0; display: flex; align-items: center;">
    <div class="custom-dropdown" id="filterDropdown">
        <input type="hidden" name="filter" id="filterInput" value="today">

        <div class="dropdown-trigger" id="dropdownTrigger">
            <div style="display: flex; align-items: center;">
                <i class="bi bi-funnel funnel-icon"></i>
                <span id="selectedFilterText">Today</span>
            </div>
            <i class="bi bi-chevron-down chevron-down"></i>
        </div>

        <div class="dropdown-menu-custom" id="dropdownMenu">
            <div class="dropdown-item-custom active" data-value="today">
                <i class="bi bi-calendar-event"></i> Today
            </div>
            <div class="dropdown-item-custom" data-value="week">
                <i class="bi bi-calendar-range"></i> This Week
            </div>
            <div class="dropdown-item-custom" data-value="month">
                <i class="bi bi-calendar-month"></i> This Month
            </div>
            <div class="dropdown-item-custom" data-value="all">
                <i class="bi bi-infinity"></i> All Time
            </div>
            <div class="dropdown-item-custom" data-value="custom">
                <i class="bi bi-calendar-plus"></i> Custom Range
            </div>
        </div>

        <!-- Custom Date Inputs (Hidden by default unless custom range is selected) -->
        <div id="customDateInputs" class="custom-range-inputs" style="display: none;">
            <div class="date-input-wrapper">
                <input type="date" name="date_from" class="custom-date-input" />
            </div>
            <span class="date-range-to"
                style="color: var(--primary); opacity: 0.5; font-size: 0.75rem; font-weight: 700;">to</span>
            <div class="date-input-wrapper">
                <input type="date" name="date_to" class="custom-date-input" />
            </div>
            <button type="submit" class="apply-btn">Apply</button>
        </div>
    </div>
</form>
