<!-- 
    Exported Header Component 
    Includes: Mobile Menu Toggle Button and Head Date Format Block
-->
<header class="top-bar">
    <div class="top-bar-left">
        <!-- Mobile Menu Toggle Button -->
        <button class="mobile-menu-toggle" id="toggleSidebar">
            <i class="bi bi-grid-fill"></i>
        </button>

        <div class="breadcrumb">
            <h1 class="page-title">Dashboard Overview</h1>
        </div>
    </div>

    <div class="top-bar-right top-bar-right-actions">
        <!-- Head Date Format Block -->
        <div class="current-date-box">
            <div class="time-section">
                <span id="real-time-clock">12:00:00 AM</span>
            </div>
            <div class="date-section">
                <i class="bi bi-calendar3"></i>
                <span id="current-date">January 1, 2026</span>
            </div>
        </div>

        <!-- Inject Filter Dropdown HTML Here if Needed -->
    </div>
</header>
